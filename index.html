    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>延续集团生命力＝建立长期竞争力；效率模式与品牌化依赖趋势周期，无法变长期；真正品牌靠长期主义与护城河。利润高位才有余力转化；Furniwell 失败因发力重心与判断标准，非品牌模式不行。Esslinger 用户为先，目标 Digital Workers；围绕预防与辅助纠正办公病痛；本土化资源可复用。选稳定周期性投入，因集团投资信心已损，须阶段性结果让集团看见持续收益。</p></div>\n<div class=\"box change\"><div class=\"box-h\">要改什么</div><p>显性化三种经营模式并勾选「品牌」；品牌模式下并列两项投入路径并勾选「稳定且长期的周期性投入」；补投资判断依据，避免用标品大盘下行误判。</p><p>怎么改：【改】全文替换 1.2。</p></div>\n<div class=\"box new\"><div class=\"box-h\">新稿</div>\n<p>延续集团生命力的本质，是在市场中建立长期竞争力。市场中存在三种经营模式（本项目已勾选「品牌」）：</p>\n<ul>\n<li>☐ <strong>效率模式</strong>：以铺货与经营效率取胜，竞争力来自运营颗粒度，随品类红利波动；</li>\n<li>☐ <strong>品牌化模式</strong>：以趋势选品＋品牌外壳取胜（亚马逊、TikTok 等平台玩法多属此类），竞争力依赖趋势与周期；</li>\n<li>☑ <strong>品牌模式</strong>（已勾选）：以用户为先、不先挑类目，通过长期主义与护城河，把竞争力沉淀为持续的支柱。品牌模式下投入路径再分两项（本项目已勾选第二项）：\n  <ul>\n    <li>☐ 一次性超大规模投入；</li>\n    <li>☑ <strong>稳定且长期的周期性投入</strong>（已勾选）。</li>\n  </ul>\n</li>\n</ul>\n<p>前两者能在较短时间维持竞争力，但依赖趋势和周期，无法把竞争力变成长期的。<strong>本项目选择第三种——品牌模式。</strong></p>\n<p><strong>公司背景</strong></p>\n<p><strong>经营通识</strong></p>\n<p>经营上，在利润高位时投入，才会有更多余力完成这个转化。</p>\n<p><strong>历史背景</strong></p>\n<p>集团在利润高位时曾开 Furniwell，投资失败后对后续品牌资产投资丧失信心。</p>\n<p><strong>原因溯源</strong></p>\n<p>Furniwell 基于效率的模式和基因去做品牌化，属于模式错配——把品牌化当品牌，用效率的逻辑去经营一个需要长期积累的事。这一错配直接动摇了集团对回报的信心。</p>\n<p><strong>结论</strong></p>\n<p>基于集团目前对品牌模式投资信心已受损，我们不选择一次性超大规模投入，而是选择稳定且长期的周期性投入，并通过阶段性结果让集团看见持续收益。</p>\n</div>",

    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文 1.2 无独立「投资逻辑收口」段；未写清看品牌盘升 vs 标品盘跌。</p></div>\n<div class=\"box change\"><div class=\"box-h\">要改什么</div><p>在 1.2 末插入投资判断依据：看品牌盘是否上升，而非标品盘是否下行；并写清三条原因（两条曲线／标品跌／品牌升）；「中间的桥」「条件性」另见文末保留段。</p></div>\n<div class=\"box new\"><div class=\"box-h\">新稿</div>\n<p><strong>判据：</strong>本项目的投资判断看<strong>品牌盘是否上升，不看标品盘是否下行</strong>。集团应据此评估投入，而非以标品价格战的下行误判整个赛道。</p>\n<p><strong>原因（支撑）：</strong></p>\n<ol>\n<li><strong>两条曲线：</strong>标品走量盘与品牌需求盘是两条不同的曲线，且存在时间差——前者先起后落，后者后起。</li>\n<li><strong>标品为何跌：</strong>升降桌作为标品被打开并完成市场教育后，同质化供给涌入，走量盘进入价格战，标品盘下行。</li>\n<li><strong>品牌为何升：</strong>用户从「基础需求」滑向「升级需求」——从「要不要买升降桌」变成「买哪个好」；有消费力、追求真正解决需求的客群在此阶段形成，品牌需求盘由此进入上升通道。</li>\n</ol>\n<blockquote>会议「中长期竞争力、服务企业生命力延续」与勾选长期投入：已并入定锚批 1.2。本收口已按 2026-10-19 语音确认改写（判据＋原因分层）。</blockquote>\n</div>",

    "title": "品牌估值逻辑及标准",
    "chapter": "一、项目概述",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文 1.2 无独立估值／评估标准段；未写 LTV/CAC 与品牌溢价区间的对应。</p></div>\n<div class=\"box change\"><div class=\"box-h\">要改什么</div><p>在投资逻辑收口后插入「品牌估值逻辑及标准」：以 LTV 为核心锚，写清 LTV/CAC 三档并列（效率型估值／品牌化估值／品牌），并列出四条辅助判据。</p></div>\n<div class=\"box new\"><div class=\"box-h\">新稿</div>\n<p><strong>核心锚：用户终身价值（LTV）。</strong>估值倍数由客户终身价值对获客成本（LTV/CAC）的倍数决定：</p>\n<ol>\n<li><strong>效率型估值</strong>：LTV/CAC ＜ 2×；</li>\n<li><strong>品牌化估值</strong>：LTV/CAC 在 2× 到 3× 之间；</li>\n<li><strong>品牌</strong>：LTV/CAC ＞ 3×（进入品牌溢价区间：息税折旧摊销 3.5–5.5 倍，跨渠道可达 5–7 倍）。</li>\n</ol>\n<p><strong>LTV 评估标准：</strong>平均客单价（含配件连带）× 平均购买次数 × 平均留存年数。</p>\n<p><strong>辅助判据（过往行业评估标准）：</strong></p>\n<ol>\n<li><strong>用户数据：</strong>邮件名单占客户总量比例超过三成，加分。</li>\n<li><strong>定价权（自建实测）：</strong><p><strong>定价权成立</strong> ⇔ ΔQ/Q₀ ≤ 0.5 × (ΔP/P₀)，且转化率跌幅不明显恶化。</p><p>其中：</p><ul><li>Q₀＝提价前 4 周的单位销量（周均）；</li><li>ΔQ＝提价后 4–8 周单位销量相对 Q₀ 的下跌量（正值＝下跌幅度）；</li><li>P₀＝提价前标价；</li><li>ΔP＝提价后标价相对 P₀ 的上调量；</li><li>转化率＝订单数／访问数，其相对提价前的跌幅不明显恶化（例如跌幅不超过约 10%，或与销量跌幅同向但不显著放大）。</li></ul><p>数值例：P₀＝1000，ΔP＝50（提价 5%），则 0.5 × 5%＝2.5%，即 ΔQ/Q₀ ≤ 2.5% 时定价权成立。</p><p><em>弹性 −0.5 参照 Zelman 对美国 PCE 家具大盘在物价涨超约 4% 年份的中位价格弹性（约 −0.42～−0.56）；正文以自建实测为准，不作「行业平均」对表。</em></p></li>\n<li><strong>渠道分散：</strong>单一平台收入占比低于六成，相对安全。</li>\n<li><strong>自然流量占比：</strong>超过四成，视为心智自生长。</li>\n</ol>\n</div>"
  },

    "title": "2.1 最高经营层定位",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文摘要</div><p>延续集团生命力的本质是建立长期竞争力。</p></div><p>本批不改。「长期竞争力」措辞可与 1.2 对齐时顺带扫一眼；非阻塞。</p>",

  {
    "id": "s22",
    "tag": "改",
    "title": "2.2 路径选择",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>稳定且长期的周期性投入。过关才置换下一阶段资源。（仅两句，无为何不走效率／品牌化。）</p></div><div class=\"box change\"><div class=\"box-h\">要改什么</div><p>基于 1.2：选择品牌模式，投入方式选择稳定且长期的周期性投入；并写清为何不走效率／品牌化；判据对齐投资窗口。全文替换。</p></div><div class=\"box new\"><div class=\"box-h\">新稿</div><p>基于 1.2 项目概述，本项目<strong>选择品牌模式</strong>，投入方式<strong>选择稳定且长期的周期性投入</strong>（均已勾选，见 1.2）。不走效率或品牌化：二者竞争力绑定趋势与周期，无法沉淀为集团需要的长期支柱。过关才置换下一阶段资源。<strong>判断该路径是否成立，看品牌盘是否上升，不以标品盘下行为否定依据（见 1.2）。</strong></p></div>",
    "chapter": "二、定位与路径"
  },
  {
    "id": "s23",
    "tag": "改",
    "title": "2.3 品牌定位",
    "body_html": "<p class=\"note\">原「品牌与品牌化」实为路径对比，已上移至 2.2；本节只写品牌定位。</p>\n<h4>品牌愿景</h4>\n<p>为数字化工作者提供健康办公解决方案。</p>\n<h4>品牌画像</h4>\n<ul>\n<li><strong>目标用户</strong>：每天连续电脑工作 6 小时以上的 Digital Workers。</li>\n<li><strong>身份画像</strong>：① 程序员；② 设计师；③ 金融分析师；④ 内容创作者（含工作室／电台等）。</li>\n<li><strong>需求画像</strong>：从「目标人群的健康办公问题」出发反推产品。帮助用户预防与辅助纠正因持续面对屏幕高强度办公产生的头，肩，腰，腿四个身体部分的健康问题。</li>\n<li><strong>产品画像</strong>：以升降桌为中心轴半径2米内，帮助用户解决健康问题，并提升办公效率的家具及配件。</li>\n</ul>",
    "chapter": "二、定位与路径"
  },
  {
    "id": "s24",
    "tag": "增",
    "title": "2.4 用户需求验证集结法",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文无独立节；健康相关散见于 1.2／4.x 办公病痛表述。</p></div><div class=\"box change\"><div class=\"box-h\">要改什么</div><p>基于 2.3 品牌定位做需求真伪验证；拆穿升降桌健康属性伪命题；给出 agent 被动调控路径；标明规划层、非 B 承诺。插在 2.3 后、第三章前。</p></div><div class=\"box new\"><div class=\"box-h\">新稿</div>\n<p>本项目在 2.3「品牌定位」中已明确品牌愿景为「为数字化工作者提供健康办公解决方案」，并完成品牌画像拆分：目标用户、身份画像、需求画像、产品画像均已界定。</p>\n<p>据此拆分可见：目标用户（每天连续电脑工作 6 小时以上的 Digital Workers）及身份画像所覆盖人群，在持续面对屏幕的高强度办公场景下，普遍存在头、肩、腰、腿等部位的健康办公问题；需求画像所指向的预防与辅助纠正诉求，构成该人群的共性需求，而非个别用户的偶发痛点。</p>\n<p>据此进一步判断：升降桌虽常被赋予健康属性，但「购置升降桌即等于获得健康」不能成立，属伪命题。</p>\n<p>其成因在于用户行为约束：受惰性影响，用户主动站立／坐姿调整的习惯养成通常仅能维持约 1 个月；而健康习惯的稳定养成至少需要约 3 个月以上。因此，依赖用户主动调控以实现健康目标，在方法论上不能成立。</p>\n<p>本项目认定的解决路径为：由 AI 生态中的 agent 对用户实施<strong>被动调控</strong>，使用户在被动过程中形成稳定习惯，升降桌的健康属性才能真正落定，由此把升降桌健康属性的伪命题变成真命题落地。</p>\n</div>",
    "chapter": "二、定位与路径"
  },
  {
    "id": "s3",
    "tag": "增",
    "title": "3.0 阶段窗口及指标",
    "body_html": "<div class=\"box new\"><div class=\"box-h\">四阶段窗口对照表（原 TABLE 0，置于 3.0 节内）</div>\n<p>展开本章项目阶段逻辑前，先以本表为统一对照基础：</p>\n<table><tr><th>阶段</th><th>窗口</th><th>品牌阶段</th><th>经营指标</th><th>品牌指标</th></tr><tr><td>A 基建期</td><td>至 2026-08-31</td><td>没有理由选你</td><td>能卖、能记账</td><td>能了解；产品常规；能送到</td></tr><tr><td>B 存活期</td><td>2026-09 至 12</td><td>开始有理由</td><td>≤49% 盖货本；≤34% 且 €8 万盖人</td><td>能说出解决了什么；配套到位</td></tr><tr><td>C 快速成长</td><td>2027-01 至 05</td><td>理由不够用</td><td>利润率 ≥10%；月 GMV ≥20 万</td><td>认可并推荐；配件针对部位</td></tr><tr><td>D 成熟期</td><td>C 过关后</td><td>新理由稳住</td><td>利润率 ≥18%；月常态 ≥25 万</td><td>持续选择；标准可交接</td></tr></table>\n<p>【保持】；C／D 行随【待决】拍板后改。</p>\n</div>\n<div class=\"box\"><div class=\"box-h\">原文要点</div><p>时间主轴用经营周期四个窗口。品牌生命周期四个阶段对齐。两者都达标才置换资源。</p></div>\n<div class=\"box change\"><div class=\"box-h\">要改什么</div><p>原文并联表述【保持】；【增】章首段落后插入尺子句：钉死到 B 窗口末日（2026-12-31）；连续一季；只达标一边不自动进入。原附表 TABLE 0 上移至本章章首作基础对照表。</p></div>\n<div class=\"box new\"><div class=\"box-h\">新稿（章首增补）</div><p>排序与验收以「<strong>B 存活期窗口末日（2026-12-31）能否被双达标决策环验收</strong>」为统一尺子：品牌与经营两侧均达标且连续一季成立，才置换下一阶段资源；只达标一边不自动进入。</p>\n<blockquote>原文「两者都达标才置换资源」保留，与本章增补尺子对齐。</blockquote></div>",
    "chapter": "三、项目阶段"
  },

    "title": "4.0 三力定义（新建）",
    "chapter": "四、三力画像及阶段落位",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文无独立「三力定义」节；三力在各阶段对外／对内条目中混用，缺统一释义。</p></div>\n<div class=\"box change\"><div class=\"box-h\">要改什么</div><p>【增】在 4.1 终局总画像之前给出用户力／产品力／服务力定义与边界，作为 4.2–4.5 落位统一标准。</p></div>\n<div class=\"box new\"><div class=\"box-h\">新稿</div>\n<p>本章后续各阶段的三力落位，均按下述定义与边界执行，不另起口径。</p>\n<ul>\n<li><strong>用户力</strong>：指用户侧对品牌的理解、认可、选择与推荐所形成的关系强度（含一方数据与自然流量质量）。边界在心智与关系，不替代产品参数，也不等同履约时效。</li>\n<li><strong>产品力</strong>：指以升降桌为中心、半径 2 米内的健康办公解决方案货盘，能否对准并持续解决目标用户的健康办公问题（含被动调控能力演进）。边界在商品与方案能力，不含客服话术与物流履约本身。</li>\n<li><strong>服务力</strong>：指履约可达、响应及时，以及在健康问题上的专业应答与方案匹配能力（含达门槛后的重服务）。边界在服务触点与专业度交付，不扩成投放获客或产品研发本身。</li>\n</ul>\n</div>"
  },

    "id": "s40",
    "tag": "增",
    "title": "4.1 三力终局画像（新建）",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文无 4.0；章首仅写「每阶段按三个维度分开。对外写用户该感知什么，对内写我们要做成什么。」四阶段直接从 4.2 起。</p></div><div class=\"box change\"><div class=\"box-h\">要改什么</div><p>以终为始——先终局总画像，再拆 4.2–4.5；三力顺序为用户力／产品力／服务力；删除本地化终局独立条；对齐 2.4 被动调控与 A2A。接在 4.0 三力定义之后；本章阶段落位自 4.2 起。</p></div><div class=\"box new\"><div class=\"box-h\">新稿</div>\n<ul>\n<li><strong>用户力终局</strong>：从「看见品牌愿景、未必认可」走向「持续选择、认可并推荐」：一方数据与自然流量成为主盘，LTV/CAC 达到品牌估值门槛（见品牌估值逻辑及标准）。</li>\n<li><strong>产品力终局</strong>：从「升降桌＋基础配件」走向「基于 AI 的个体化健康解决方案」，承载被动调控能力（见 2.4）。</li>\n<li><strong>服务力终局</strong>：从履约服务转为专业度服务——以健康问题的专业应答与方案匹配为核心，月销达门槛后再叠加重服务。</li>\n</ul>\n<p>终局用户关系形态为 <strong>Agent to Agent</strong>：用户 agent 与品牌 agent 对接，索取方案与产品清单。</p>\n</div>",
    "chapter": "四、三力画像及阶段落位"

    "title": "4.2 阶段一：用户没有理由选你",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文摘要</div><p><strong>岗位</strong>：运营、投放、产品开发、平面、建模、客服</p>\n<p><strong>对外</strong>：用户力—能看到品牌在说「为 Digital Workers 提供健康办公解决方案」，但不一定认可；产品力—常规升降桌及基础配件；服务力—德国能送到、能退，客服有人回复。</p>\n<p><strong>对内</strong>：用户力—写进页面并让用户感知；产品力—主桌三件套、办公桌中心直径 2 米；服务力—物流履约、客服基础回复稿。</p></div><p>本批不改。终局对齐后若需阶段措辞回扫，属后续轻改。</p>",

    "title": "4.5 阶段四：新理由稳住 · 对外产品力",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>对外·产品力原文：「清楚感知到 Esslinger 基于 AI 提供的健康解决方案进一步解决客制化病痛问题，并有对应的解决方案可供选择。」（用户力／服务力／对内条目本批不动。）</p>\n<p>另：用户力—专业度与愿景、共创；服务力—可重复，月销达 10 万欧后重服务；对内产品力—手控器与主桌迭代、标准文件齐全。</p></div><div class=\"box change\"><div class=\"box-h\">要改什么</div><p>把「基于 AI 提供」收口为「被动调控能力」，对齐 2.4 与 4.1；避免写成主动调控已交付。仅替换对外·产品力一句；其余【保持】。</p></div><div class=\"box new\"><div class=\"box-h\">新稿（仅对外·产品力一句）</div><p>用户清楚感知到 Esslinger 基于 AI 对健康方案的<strong>被动调控能力</strong>，能进一步解决客制化病痛问题，并有对应方案可选（对齐 2.4 与 4.1）。</p>\n<blockquote>本节其余条目保留原文。</blockquote></div>",

  {
    "id": "s45",
    "tag": "增",
    "title": "4.6 搜索内容地基与 Agent 方向（新建）",
    "body_html": "<div class=\"box\"><div class=\"box-h\">原文要点</div><p>原文无独立节；SEO／GEO／Agent 未写入计划书。</p></div><div class=\"box change\"><div class=\"box-h\">要改什么</div><p>落位 PR＝内容地基、SEO 基础、GEO 进阶、终局 A2A；B 段只承诺 PR／SEO 建设，不承诺 TikTok 等转化。挂在三力章。</p></div><div class=\"box new\"><div class=\"box-h\">新稿</div><ul>\n<li><strong>PR 品牌曝光＝内容地基</strong>：没有内容，SEO 与 GEO 都无法成立。</li>\n<li><strong>SEO（基础层）</strong>：面向人主动搜索，是当前阶段基础建设。</li>\n<li><strong>GEO（进阶层）</strong>：AI 替人搜索、总结并给出判断依据，人再决策。</li>\n<li><strong>终局 Agent to Agent</strong>：用户 agent ↔ 品牌 agent，要方案与产品清单。</li>\n</ul>\n<p><strong>B 段落位</strong>：以 <strong>PR／SEO 内容建设为主</strong>，为 GEO 与后续 agent 打地基；<strong>不承诺 TikTok 等平台转化结果</strong>，相关投入按内容资产而非销售承诺核算。GEO 与 Agent to Agent 为 C–D 段规划方向。</p></div>",

  },
  {
    "id": "s5intro",
    "tag": "保持",

const KEY = 'esslinger_plan_framework_feedback_v3';
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function saveAll(d){localStorage.setItem(KEY,JSON.stringify(d))}
function render(){
  const data=loadAll(); const toc=document.getElementById('toc'); const main=document.getElementById('main');
  toc.innerHTML=''; main.innerHTML='';
  let lastCh='';
  SECTIONS.forEach(s=>{
    const fb=data[s.id]||{};
    const ch=s.chapter||'';
    if(ch && ch!==lastCh){
      const h=document.createElement('div'); h.className='ch'; h.textContent=ch; toc.appendChild(h); lastCh=ch;
    }
    const a=document.createElement('a'); a.href='#'+s.id; a.dataset.id=s.id;
    a.innerHTML='<span class="dot '+(fb.status||'')+'"></span>'+s.title; toc.appendChild(a);
    const card=document.createElement('section'); card.className='card'; card.id=s.id;
    card.innerHTML='<h2><span class="chip '+s.tag+'">'+s.tag+'</span>'+s.title+'</h2><div class="body">'+s.body_html+'</div>'+
      '<div class="feedback"><div class="ft">本段反馈</div><div class="row">'+
      '<label><input type="radio" name="st-'+s.id+'" value="ok"'+(fb.status==='ok'?' checked':'')+'/> 通过</label>'+
      '<label><input type="radio" name="st-'+s.id+'" value="edit"'+(fb.status==='edit'?' checked':'')+'/> 需修改</label>'+
      '<label><input type="radio" name="st-'+s.id+'" value="discuss"'+(fb.status==='discuss'?' checked':'')+'/> 待议</label></div>'+
      '<textarea placeholder="改法、措辞、要删/要加…（可选）" data-id="'+s.id+'">'+(fb.note||'').replace(/</g,'&lt;')+'</textarea>'+
      '<div class="fb-actions"><button type="button" class="primary save-btn" data-id="'+s.id+'">保存本段</button>'+
      '<span class="saved" id="saved-'+s.id+'">已保存</span></div></div>';
    main.appendChild(card);
  });
  updateProgress(); bind();
  document.querySelectorAll('main .card').forEach(el=>io.observe(el));
}
function saveSection(id, flash){
  const status=(document.querySelector('input[name="st-'+id+'"]:checked')||{}).value||'';
  const note=(document.querySelector('textarea[data-id="'+id+'"]')||{}).value||'';
  const data=loadAll(); data[id]={status,note:note.trim(),updatedAt:new Date().toISOString()}; saveAll(data);
  if(flash){const el=document.getElementById('saved-'+id); if(el){el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200)}}
  updateProgress();
  const link=document.querySelector('nav.toc a[data-id="'+id+'"] .dot'); if(link) link.className='dot '+status;
}
function bind(){
  document.querySelectorAll('.save-btn').forEach(btn=>{ btn.onclick=()=>saveSection(btn.dataset.id,true); });
  document.querySelectorAll('input[type=radio][name^="st-"]').forEach(r=>{
    r.addEventListener('change',()=>{ const id=r.name.replace(/^st-/,''); saveSection(id,true); });
  });
  document.querySelectorAll('textarea[data-id]').forEach(ta=>{
    let t=null;
    ta.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>saveSection(ta.dataset.id,false),400); });
  });
}
function showToast(msg, isErr){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(isErr?' err':'');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>el.classList.remove('show'),3500);
}
const API_BASE = (location.hostname.endsWith('github.io') || location.protocol==='file:')
  ? 'https://aqbyn-140-248-52-13.run.pinggy-free.link' : '';
async function copyFeedbackMd(){
  const md=exportMd();
  try{ await navigator.clipboard.writeText(md); return true; }
  catch(err){
    const ta=document.createElement('textarea');
    ta.value=md; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    return ok;
  }
}
function showFallbackCopied(reason){
  const old=document.getElementById('fallbackOverlay');
  if(old) old.remove();
  const ov=document.createElement('div');
  ov.className='fallback-overlay'; ov.id='fallbackOverlay';
  ov.innerHTML='<div class="fallback-card"><h3>复制成功，发回聊天</h3>'+
    '<p>在线提交通道暂不可用'+(reason?'（'+reason+'）':'')+'。<br/>反馈 Markdown 已复制到剪贴板，请粘贴发回聊天给整盘操盘。</p>'+
    '<div class="actions">'+
    '<button class="primary" id="fbClose">知道了</button>'+
    '<button class="ghost" id="fbMailto">用邮件发送</button>'+
    '<button class="ghost" id="fbIssue">开 GitHub Issue</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  document.getElementById('fbClose').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  const md=exportMd();
  document.getElementById('fbMailto').onclick=()=>{
    const sub=encodeURIComponent('Esslinger 原文框架改点反馈');
    const body=encodeURIComponent(md.slice(0,1800));
    location.href='mailto:?subject='+sub+'&body='+body;
  };
  document.getElementById('fbIssue').onclick=()=>{
    const title=encodeURIComponent('原文框架改点反馈 '+new Date().toISOString().slice(0,10));
    const body=encodeURIComponent(md.slice(0,5500));
    window.open('https://github.com/jackypang1998/esslinger-plan-preview/issues/new?title='+title+'&body='+body,'_blank');
  };
}
async function submitAll(){
  SECTIONS.forEach(s=>saveSection(s.id,false));
  const sections=loadAll();
  const btn=document.getElementById('btnSubmit');
  btn.disabled=true;
  const tryApi = async ()=>{
    if(!API_BASE && (location.hostname.endsWith('github.io') || location.protocol==='file:')){
      throw new Error('隧道未配置');
    }
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),8000);
    try{
      const res=await fetch((API_BASE||'')+'/api/feedback',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Pinggy-No-Screen':'1'},
        body:JSON.stringify({sections, meta:{source:'preview-page-framework', host:location.host, userAgent:navigator.userAgent, at:new Date().toISOString()}}),
        signal:ctrl.signal
      });
      const j=await res.json().catch(()=>({}));
      if(!res.ok || !j.ok){ throw new Error(j.error||('HTTP '+res.status)); }
      return true;
    }finally{ clearTimeout(timer); }
  };
  try{
    await tryApi();
    showToast('已提交，整盘操盘可收到');
    alert('已提交，整盘操盘可收到');
  }catch(e){
    const reason=(e && e.name==='AbortError')?'超时':(e && e.message)||'网络错误';
    const ok=await copyFeedbackMd();
    showToast(ok?'已复制，请发回聊天':'复制失败，请点「复制反馈 Markdown」', !ok);
    if(ok) showFallbackCopied(reason);
    else alert('提交失败：'+reason+'\n自动复制也失败，请手动点「复制反馈 Markdown」发回聊天。');
  }finally{ btn.disabled=false; }
}
function updateProgress(){
  const data=loadAll(); const n=SECTIONS.filter(s=>data[s.id]&&data[s.id].status).length;
  document.getElementById('progress').textContent='反馈 '+n+'/'+SECTIONS.length;
}
function exportMd(){
  const data=loadAll(); const map={ok:'通过',edit:'需修改',discuss:'待议'};
  let md='# Esslinger 原文框架与改点 · 预览反馈\n\n导出时间：'+new Date().toLocaleString('zh-CN',{hour12:false})+'\n\n';
  SECTIONS.forEach(s=>{const fb=data[s.id]||{}; md+='## ['+s.tag+'] '+s.title+'\n- 状态：'+(map[fb.status]||'未填')+'\n- 意见：'+(fb.note?fb.note.replace(/\n/g,' '):'（无）')+'\n\n'});
  return md;
}
document.getElementById('btnExport').onclick=()=>{const blob=new Blob([exportMd()],{type:'text/markdown;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Esslinger_原文框架改点_预览反馈.md'; a.click()};
document.getElementById('btnCopy').onclick=async()=>{await navigator.clipboard.writeText(exportMd()); alert('反馈 Markdown 已复制，发给整盘操盘即可。')};
document.getElementById('btnSubmit').onclick=()=>submitAll();
const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav.toc a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id))}})},{rootMargin:'-30% 0px -60% 0px'});
render();
</script>
