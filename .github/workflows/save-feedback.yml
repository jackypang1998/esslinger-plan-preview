name: Save preview feedback
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: read
jobs:
  save:
    if: startsWith(github.event.issue.title, 'Esslinger定锚批反馈')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write feedback JSON
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          N: ${{ github.event.issue.number }}
          AT: ${{ github.event.issue.updated_at }}
        run: |
          mkdir -p data/submissions
          python3 << 'PY'
          import json, os, re, datetime
          body = os.environ.get("BODY") or ""
          # Prefer fenced json block
          m = re.search(r"```json\s*(\{.*?\})\s*```", body, re.S)
          sections = {}
          if m:
              try:
                  payload = json.loads(m.group(1))
                  sections = payload.get("sections") or payload
              except Exception:
                  sections = {"_raw": body}
          else:
              sections = {"_raw_markdown": body}
          rec = {
              "receivedAt": os.environ.get("AT") or datetime.datetime.utcnow().isoformat()+"Z",
              "sections": sections,
              "meta": {"source": "github-issue", "issue": int(os.environ["N"]), "title": os.environ.get("TITLE")}
          }
          stamp = datetime.datetime.utcnow().strftime("%Y%m%d-%H%M%S")
          path = f"data/submissions/{stamp}-issue-{os.environ['N']}.json"
          open(path,"w",encoding="utf-8").write(json.dumps(rec,ensure_ascii=False,indent=2))
          open("data/latest.json","w",encoding="utf-8").write(json.dumps(rec,ensure_ascii=False,indent=2))
          print("wrote", path)
          PY
      - name: Commit
        run: |
          git config user.name "feedback-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feedback: issue #${{ github.event.issue.number }}"
          git push
